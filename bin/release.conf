# Freshet release toolchain — the per-plugin half.
#
# bin/build-release.sh, bin/deploy-svn.sh, bin/render-assets.sh and
# bin/pngcrop.js are identical in every Freshet plugin repo. Everything that
# differs between plugins is data and lives here.

SLUG="freshet-unused-media"
VERSION_FILE="freshet-unusedmedia.php"
VERSION_CONST="FRESHET_UNUSEDMEDIA_VERSION"

# Build steps this plugin needs (1 = run, 0 = skip).
BUILD_NPM=0        # no JS build step
BUILD_COMPOSER=0   # no composer dependencies
SALES_ZIP=1        # the paid tier sells direct, so build both archives
TAG_RELEASE=0      # tagging a release is a deliberate, separate step here

# Excluded on top of the shared baseline in bin/build-release.sh.
EXTRA_EXCLUDES=()

# Removed from the wp.org archive only — directory guidelines 5 & 8 allow no
# license checks and no upsell surfaces. The whole of the paid tier goes: the
# license interface and client, every feature a key unlocks, and the one
# bootstrap that wires them, so the directory build carries no tier at all —
# nothing locked, nothing that reads a license, nothing that names one.
# Plugin.php asks for Extension\Bootstrap once and moves on when it is not there.
WPORG_STRIP=(
  'src/Extension/Bootstrap.php'
  'src/Extension/UsedTab.php'
  'src/License/LicenseInterface.php'
  'src/License/NoLicense.php'
  'src/License/RemoteLicense.php'
  'src/License/LicenseClient.php'
  'src/Admin/LicenseSection.php'
  'src/Admin/UsedView.php'
  'src/Admin/EvidenceReport.php'
  'src/Admin/SpaceTotals.php'
  'src/Admin/PluginRow.php'
  'src/Cli/ScanCommand.php'
  'assets/pro.css'
  # The template is generated from the whole tree, so it carries the paid
  # strings; wordpress.org builds language packs from the code and never
  # reads a shipped .pot.
  'languages/freshet-unused-media.pot'
)

# wp.org page assets to rasterise: <svg> <render-size> <out.png> <crop-height>
# icon.svg ships as-is; the PNGs are fallbacks for clients that do not take it.
ASSET_RENDERS=(
  'icon.svg 128 icon-128x128.png 128'
  'icon.svg 256 icon-256x256.png 256'
  'banner.svg 772 banner-772x250.png 250'
  'banner.svg 1544 banner-1544x500.png 500'
)

# wordpress.org SVN.
SVN_USER="kristoffbertram"
